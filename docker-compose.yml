services:
  api:
    build: ./api
    volumes:
      - ./api:/app
      - /app/node_modules
    ports:
      - "3002:3002"
    environment:
      DATABASE_URL: "postgresql://deacons_app:deacons_local_pw@shared-postgres:5432/deacons_local"
    networks:
      - default
      - shared_net

  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5174:5174"
    command: sh -c "npm install && npm run dev"
    networks:
      - default

networks:
  shared_net:
    external: true
